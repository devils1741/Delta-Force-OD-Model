model:
  onnx_path: weights/best_640.onnx
  engine_path: weights/best_640.engine
  input_width: 640
  input_height: 640

inference:
  target_fps: 240
  score_threshold: 0.30
  max_detections: 300

capture:
  output_index: 0
  roi_width: 1280
  roi_height: 1280

tensorrt:
  fp16: true
  int8: false
  calibration_cache: weights/best_640_int8.cache
  workspace_mb: 1024
