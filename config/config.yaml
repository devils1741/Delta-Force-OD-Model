model:
  onnx_path: weights/best.onnx
  engine_path: weights/best.engine
  input_width: 1280
  input_height: 1280

inference:
  target_fps: 500
  score_threshold: 0.55
  max_detections: 300
  lost_target_frame_limit: 1
  min_target_width_px: 24
  min_target_height_px: 48
  log_interval_frames: 100

capture:
  show_region_box: true # 是否显示截屏区域边框
  output_index: 0
  roi_width: 1280
  roi_height: 1280

mouse:
  enabled: true # 是否启用鼠标自动操作
  mode: relative
  relative_scale: 0.9
  move_cooldown_frames: 0

tensorrt:
  fp16: true
  int8: false
  calibration_cache: weights/best_640_int8.cache
  workspace_mb: 1024
