model:
  onnx_path: weights/best_640_fp32.onnx
  engine_path: weights/best_640_fp32.engine
  input_width: 640
  input_height: 640

inference:
  show_keypoints: true
  keypoint_threshold: 0.3
  keypoint_radius_px: 8.0
  show_friend_boxes: true
  show_friend_logo_boxes: true
  logo_score_threshold: 0.3
  logo_min_width_px: 0.0
  logo_min_height_px: 0.0
  target_fps: 500
  score_threshold: 0.55
  max_detections: 300
  lost_target_frame_limit: 1
  min_target_width_px: 24
  min_target_height_px: 48
  log_interval_frames: 100

capture:
  show_region_box: true # 是否显示截屏区域边框
  output_index: 0
  roi_width: 1280
  roi_height: 1280

mouse:
  enabled: true
  mode: relative
  relative_scale: 1.0 # 通用倍率，通常保持 1，只微调下面的 X/Y
  relative_scale_x: 1.40 # (100/74 + 100/69)/2，水平输入单位/像素
  relative_scale_y: 1.70 # (100/85 + 500/224)/2，垂直输入单位/像素
  lock_target: true # 首次选最近目标，按住期间跟随同一敌人
  target_lost_grace_ms: 150 # 短暂丢检先暂停，超时后才重新选目标
  relative_direct: true # 一次发送完整换算位移，忽略 gain/max_step 和平滑
  relative_gain: 0.2 # 每次修正比例，与上面的比例相乘
  relative_max_step: 12 # 每轴单次输入上限
  relative_deadzone_px: 2.0
  relative_feedback_ms: 50 # 画面反馈等待时间；与移动间隔取较大值
  move_interval_ms: 0
  target_smoothing_ms: 0

tensorrt:
  fp16: true
  int8: false
  calibration_cache: weights/best_640_int8.cache
  workspace_mb: 1024
